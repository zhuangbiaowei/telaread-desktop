# Tela 默认主题：Catppuccin Mocha（深色）。
#
# 一个主题 = 三组配置：图标、排版（字体 + 颜色）、边框修饰。
# 任何一项都可以省略，省略时沿用 Tela 的默认值。

name = "Catppuccin Mocha"
appearance = "dark"

[icons]
# Lucide 图标名（https://lucide.dev/icons），也可以直接写一个字/emoji；留空不显示。
feed = "rss"
bookmark = "bookmark"
article = "file-text"
recommendation = "star"
button = "sparkles"
external = "external-link"
cache = "download"
add = "plus"
remove = "circle-x"
theme = "palette"

[typography]
# 字体名要与系统里安装的字体一致；留空表示用系统默认字体。
# body_font = "Noto Serif CJK SC"
mono_font = "monospace"
body_size = 17.0
line_height = 1.75
paragraph_gap = 0.55
heading_scale = 1.0

[colors]
background = "#11111b"
sidebar = "#181825"
surface = "#1e1e2e"
text = "#cdd6f4"
muted = "#6c7086"
subtle = "#a6adc8"
accent = "#89b4fa"
danger = "#f38ba8"
warning = "#f9e2af"
heading = "#cdd6f4"
link = "#89b4fa"
code_text = "#cdd6f4"
code_background = "#1e1e2e"
quote = "#a6adc8"
selection = "#89b4fa55"
hover = "#1e1e2e"
selected = "#313244"
on_accent = "#11111b"

[borders]
border = "#313244"
divider = "#313244"
focus = "#89b4fa"
