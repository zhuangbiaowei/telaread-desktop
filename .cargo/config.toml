# Windows 产物必须「解压即用」：不能要求用户先装 Visual C++ 运行库。
#
# windows-msvc 默认动态链接 CRT，生成的 exe 在导入表里引用
# VCRUNTIME140.dll / MSVCP140.dll。干净的 Windows 上（没装过 VC++ 2015-2022
# Redistributable）双击 tela-gui.exe 就会报 "VCRUNTIME140.dll was not found"。
#
# 这里只对 Windows 目标打开 crt-static：rustc 改为链接静态 CRT
# （libcmt / libvcruntime / libucrt），exe 不再依赖任何 VC++ 运行库 DLL。
# C 依赖（aws-lc-sys 的 cmake 构建、libsqlite3-sys 的 cc 构建）会通过
# CARGO_CFG_TARGET_FEATURE 看到 crt-static，自动改用 /MT，两边的运行库一致，
# 不会出现 LNK2038 的 RuntimeLibrary 不匹配。
#
# 不要改成在 CI 里临时设置 RUSTFLAGS：把开关放在这里，本地
# `cargo build --release` 与发布包的链接方式才一致，bug 在开发机上就能复现。
# release.yml 里还有一道护栏：打包前扫描 exe 导入表，发现动态 CRT 就失败。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
